.slice(0,n):ids;s.pos=0;s.answer=null;s.conf='曖昧';s.mode=c;s.limit=n;save();render()}function resume(){if(s.queue[s.pos]!==undefined)render();else home()}function render(){let id=s.queue[s.pos],q=bank[id];if(!q){if(s.mode==="模試"){app.innerHTML=`<section><h2>模試結果</h2>${cats.map((c,i)=>{let n=s.mockResults.filter(x=>x.c===c&&x.ok).length;return `<p>${c}：${n}/${[15,10,10][i]} ${n>=[9,6,6][i]?"基準到達":"要復習"}</p>`}).join("")}<p>解説付き演習の結果です。本試験の合格を保証しません。</p><button onclick="home()">ホーム</button></section>`}else analysis();return}app.innerHTML=`<section><small>${q.c} ／ ${q.t} ／ ${q.level} ・ ${s.pos+1}/${s.queue.length}</small><h2>${q.q}</h2><label>自信度 <select onchange="s.conf=this.value;save()" ${s.answer!==null?'disabled':''}>${['自信あり','曖昧','勘'].map(x=>`<option ${x===s.conf?'selected':''}>${x}</option>`).join('')}</select></label>${q.a.map((a,i)=>`<button class="opt ${s.answer!==null?(a.ok?'good':s.answer===i?'bad':''):''}" ${s.answer!==null?'disabled':''} onclick="answer(${i})">${i+1}. ${a.text}</button>`).join('')}${s.answer!==null?`<h2>${q.a[s.answer].ok?'正解':'不正解'}</h2><h3>考え方・重要知識</h3><p>${q.explain}</p>${q.a.map((a,i)=>`<p><b>${i+1}. ${a.ok?'正解の選択肢':'不正解の選択肢'}：${a.text}</b><br>${a.why}</p>`).join('')}<button class="primary" onclick="next()">次の問題</button>`:''}<button onclick="home()">中断して保存</button></section>`}function answer(i){if(s.answer!==null)return;let id=s.queue[s.pos];s.answer=i;if(s.mode==="模試")s.mockResults.push({c:bank[id].c,ok:bank[id].a[i].ok});s.h.push({id,ok:bank[id].a[i].ok,conf:s.conf,date:new Date().toISOString()});save();render()}function next(){s.pos++;s.answer=null;s.conf='曖昧';if(s.pos>=s.queue.length&&s.limit===0){let ids=shuffle(bank.map((q,i)=>i).filter(i=>s.mode==='全科目'||(s.mode==='苦手問題'?weak(i):bank[i].c===s.mode)));if(ids.length){s.queue=ids;s.pos=0}}save();render()}function analysis(){let topics={};bank.forEach((q,i)=>{if(weak(i))topics[q.c+'／'+q.t]=(topics[q.c+'／'+q.t]||0)+1});app.innerHTML=`<section><h2>学習分析</h2>${stats().map(x=>`<p>${x.c}：${x.done?Math.round(x.ok/x.done*100)+'%':'未測定'} ／ 要復習 ${x.weak}問</p>`).join('')}<h3>重点復習</h3>${Object.entries(topics).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<p>${k}：${v}問</p>`).join('')||'まだ弱点データがありません。'}<p><small>演習済み問題の正答率であり、合格予測ではありません。</small></p><button onclick="copyAnalysis()">ChatGPT分析用データを表示</button><textarea id="report" rows="5" readonly hidden></textarea></section>`}function copyAnalysis(){let e=document.getElementById('report');e.hidden=false;e.value='乙4の学習結果を分析し次の15分の学習を提案してください。'+JSON.stringify(stats())+' 要復習：'+JSON.stringify(bank.filter((q,i)=>weak(i)).map(q=>q.t));e.select()}function backup(){app.innerHTML='<section><h2>記録の保存・復元</h2><p>ブラウザの保存領域が使える場合は自動保存します。念のため下の記録をメモにコピーしてください。</p><textarea id="data" rows="8"></textarea><button onclick="document.getElementById(\'data\').select()">記録を選択</button><button onclick="restore()">貼り付けた記録を復元</button></section>';document.getElementById('data').value=JSON.stringify({...s,version:4})}function restore(){try{let x=JSON.parse(document.getElementById('data').value);if(x.version!==4||!Array.isArray(x.h)||!Array.isArray(x.queue)||!x.h.every(y=>Number.isInteger(y.id)&&bank[y.id]&&typeof y.ok==='boolean')||!x.queue.every(i=>Number.isInteger(i)&&bank[i])||!Number.isInteger(x.pos)||x.pos<0||x.pos>x.queue.length)throw Error();s=x;save();home()}catch(e){alert('記録の形式を確認してください')}}home();if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></html>
